:root{
  --paper:#FAF9F5;
  --ink:#141413;
  --muted:#5E5D59;
  --rule:#DEDCD1;
  --accent:#141413;
  --wash:#F0EEE6;
  --wash-2:#E8E6DC;
  --blue:#0E5499;
  --radius:16px;

  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;

  --measure:34rem;
  --gutter:clamp(1.25rem,4vw,3rem);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:1.0625rem;
  line-height:1.62;
  font-feature-settings:"onum" 1;
}

.skip{position:absolute;left:-9999px}
.skip:focus{left:var(--gutter);top:.5rem;z-index:20;background:var(--ink);color:var(--paper);padding:.6rem 1rem;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}

/* ---------- shell ---------------------------------------- */
.shell{max-width:60rem;margin:0 auto;padding:0 var(--gutter) 6rem}

/* ---------- masthead ------------------------------------- */
.masthead{
  display:flex;flex-wrap:wrap;gap:1rem 2rem;
  align-items:center;justify-content:space-between;
  padding:2.25rem 0 1.1rem;
  border-bottom:1px solid var(--ink);
  margin-bottom:3rem;
  position:sticky;top:0;z-index:10;background:var(--paper);
}
.masthead .wordmark{
  font-size:1rem;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;text-decoration:none;color:var(--ink);
}
.masthead nav{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem;font-size:.98rem}
.masthead nav a{color:var(--ink);text-decoration:none;text-underline-offset:.3em;text-decoration-thickness:1px}
.masthead nav a:hover{text-decoration-line:underline}
.masthead nav a[aria-current="page"]{text-decoration-line:underline;text-decoration-thickness:2px}
.masthead nav a:last-child{background:var(--accent);color:var(--paper);padding:.45rem 1rem;border-radius:4px;text-decoration:none;transition:background-color 200ms ease}
.masthead nav a:last-child:hover{background:#000}
.masthead nav a:last-child[aria-current="page"]{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--accent)}

/* ---------- type ----------------------------------------- */
h1{font-size:clamp(2rem,4.6vw,2.9rem);line-height:1.14;font-weight:600;letter-spacing:-.012em;margin:0 0 .9rem;max-width:22ch}
h2{font-size:1.28rem;font-weight:600;letter-spacing:-.005em;margin:3rem 0 .85rem}
h3{font-size:1.02rem;font-weight:600;margin:1.9rem 0 .5rem}
p,ul,ol{max-width:var(--measure)}
p{margin:0 0 1.05rem}
li{margin-bottom:.4rem}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2.5px;color:var(--ink)}
strong,b{font-weight:600}
sub,sup{line-height:0}

.label,.eyebrow,.meta,figcaption,.filelist,.stat-key{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.eyebrow{display:block;margin-bottom:.9rem}
.label{display:block;margin:2.4rem 0 .6rem;color:var(--ink)}
.lede{font-size:1.2rem;line-height:1.5;color:var(--ink);max-width:36rem}

/* ---------- index: the figure register -------------------- */
/* Signature device: each project is identified by the number
   that is its point — the pressure drop, the window, the shift. */

.register{margin-top:3rem}
.register-group{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);padding-bottom:.7rem;border-bottom:1px solid var(--ink);margin-top:3.5rem;
}
.register-group:first-child{margin-top:0}
.entry-course{
  float:right;margin:.35rem 0 .4rem 1.5rem;max-width:15rem;text-align:right;
  font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);line-height:1.5;
}
.entry{
  display:grid;
  grid-template-columns:minmax(0,15rem) minmax(0,1fr);
  gap:1.25rem 2.5rem;
  padding:1.9rem 0;
  border-bottom:1px solid var(--rule);
  text-decoration:none;color:inherit;
  transition:background 140ms ease;
}
.entry{cursor:pointer}
.entry:hover{background:var(--wash)}
.entry:hover .entry-title{text-decoration:underline;text-underline-offset:3px}

.entry-fig{padding-top:.1rem}
.entry-num{
  display:block;font-size:1.72rem;line-height:1.08;font-weight:600;
  letter-spacing:-.02em;color:var(--ink);
  font-feature-settings:"onum" 0,"tnum" 1;
}
.entry-num .u{font-size:.62em;font-weight:400;letter-spacing:0;color:var(--muted)}
.entry-fig-rows{display:flex;flex-direction:column;gap:.85rem}
.entry-fig-rows .entry-num{font-size:1.3rem}
.entry-fig-rows .entry-numnote{margin-top:.2rem}
.entry-numnote{
  display:block;margin-top:.45rem;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);line-height:1.5;max-width:15rem;
}
.entry-title{font-size:1.22rem;font-weight:600;margin:0 0 .3rem;letter-spacing:-.005em}
.entry-note{margin:0 0 .55rem;color:var(--ink);max-width:32rem}
.entry-meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.entry-more{
  display:inline-block;margin-top:.9rem;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);padding:.5rem .95rem;
  transition:background 140ms ease,color 140ms ease;
}
.entry:hover .entry-more,.entry:focus-visible .entry-more{background:var(--accent);color:var(--paper)}
.entry-more .arr{display:inline-block;transition:transform 140ms ease}
.entry:hover .entry-more .arr,.entry:focus-visible .entry-more .arr{transform:translateX(4px)}
@media (prefers-reduced-motion:reduce){.entry-more .arr{transition:none}}

/* ---------- project header -------------------------------- */
.project-head{border-bottom:1px solid var(--rule);padding-bottom:1.6rem}
.spec{display:flex;flex-wrap:wrap;gap:.4rem 2.2rem;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--rule)}
.spec div{display:flex;flex-direction:column;gap:.15rem;max-width:20rem}
.spec dt,.stat-key{font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0;font-size:.94rem;line-height:1.45}

/* ---------- stat row -------------------------------------- */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));
  gap:1.6rem 2.2rem;margin:2rem 0;padding:1.3rem 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  max-width:46rem;
}
.stat-val{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.015em;font-feature-settings:"onum" 0,"tnum" 1}
.stat-note{display:block;margin-top:.25rem;font-size:.9rem;line-height:1.45;color:var(--muted)}

/* ---------- result callout -------------------------------- */
.result{border-left:2px solid var(--ink);padding:.2rem 0 .2rem 1.2rem;margin:2rem 0;max-width:38rem}
.result p:last-child{margin-bottom:0}

/* ---------- formula block --------------------------------- */
.eqblock{background:var(--wash);border:1px solid var(--rule);padding:1.1rem 1.3rem;margin:1.6rem 0;max-width:46rem;overflow-x:auto}
.eqblock dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.45rem 1.4rem;font-family:var(--mono);font-size:.82rem}
.eqblock dt{color:var(--muted);white-space:nowrap}
.eqblock dd{margin:0}

.terminal{background:var(--wash);border:1px solid var(--rule);padding:1.1rem 1.3rem;margin:1.6rem 0;max-width:46rem;overflow-x:auto;font-family:var(--mono);font-size:.74rem;line-height:1.55;white-space:pre}

/* ---------- tables ---------------------------------------- */
.tbl{width:100%;border-collapse:collapse;margin:1.7rem 0;font-size:.92rem;max-width:46rem}
.tbl th{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:400;text-align:left;
  border-bottom:1px solid var(--ink);padding:0 1.1rem .5rem 0;vertical-align:bottom;
}
.tbl td{border-bottom:1px solid var(--rule);padding:.65rem 1.1rem .65rem 0;vertical-align:top;line-height:1.45}
.tbl tr.pick td{background:var(--wash)}
.tbl tr.pick td:first-child{font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
.tbl tr.pick td:first-child{padding-left:.9rem}
.tbl-wrap{overflow-x:auto;max-width:46rem}

/* ---------- figures --------------------------------------- */
figure{margin:2.2rem 0;max-width:46rem}
figure img{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--rule)}
figcaption{margin-top:.7rem;text-transform:none;letter-spacing:.005em;font-family:var(--serif);font-size:.92rem;line-height:1.55;color:var(--muted);max-width:40rem}
figcaption b{color:var(--ink);font-weight:500}
.figs{margin:2.2rem 0;max-width:46rem}
.figs figure{margin:0}
.figs-2{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media (max-width:640px){.figs-2{grid-template-columns:1fr;gap:2rem}}

/* ---------- grade chart ----------------------------------- */
.chart{margin:2rem 0;max-width:46rem}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{stroke:var(--ink);stroke-width:1}
.chart .band{fill:var(--wash)}
.chart .line{fill:none;stroke:var(--ink);stroke-width:1.5}
.chart .avgline{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.chart .tick{font-family:var(--mono);font-size:9px;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.chart-legend{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;margin-top:.9rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:.45rem}
.chart-legend i{width:1.1rem;height:0;border-top:1.5px solid var(--ink);display:inline-block}
.chart-legend i.dash{border-top:1px dashed var(--accent)}
.chart-legend i.band{height:.6rem;border:1px solid var(--rule);background:var(--wash)}
.chart{position:relative}
.chart .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity 120ms ease}
.chart .dot{transition:r 120ms ease}
.chart .dot.on{r:5}
.chart-tip{
  position:absolute;top:0;left:0;pointer-events:none;opacity:0;transition:opacity 120ms ease;
  background:var(--accent);color:var(--paper);padding:.45rem .65rem;border-radius:4px;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;line-height:1.5;white-space:nowrap;
}
.chart-tip b{font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.chart.hovering .guide,.chart.hovering .chart-tip{opacity:1}
/* entrance: hidden until the chart scrolls into view, then drawn left to right */
.chart.pre .band,.chart.pre .grid,.chart.pre .tick{opacity:0}
.chart .band,.chart .grid,.chart .tick{transition:opacity 600ms ease}
.chart .dot{transition:opacity 250ms ease,r 120ms ease}
.chart .dot.hide{opacity:0}
.toggle{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:1px solid var(--accent);color:var(--accent);
  padding:.5rem .95rem;margin-top:1rem;cursor:pointer;
  transition:background 140ms ease,color 140ms ease;
}
.toggle:hover{background:var(--accent);color:var(--paper)}

/* ---------- CV header, text left and portrait right -------- */
.cv-head{display:grid;grid-template-columns:minmax(0,1fr) 11rem;gap:1.2rem 2.5rem;align-items:start}
.cv-head > div:first-child > :first-child{margin-top:0}
.cv-head .portrait{margin:0;max-width:none;padding:.4rem;background:#fff;border:1px solid var(--rule);border-radius:var(--radius)}
.cv-head .portrait img{
  width:100%;aspect-ratio:3/4;object-fit:cover;height:auto;display:block;
  border:0;background:#fff;border-radius:11px;
}

/* ---------- contact --------------------------------------- */
.contact-list{margin-top:2.5rem;border-top:1px solid var(--ink);max-width:46rem}
.contact-row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:.4rem 2.5rem;align-items:baseline;padding:1.4rem 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;transition:background 140ms ease}
.contact-row:hover{background:var(--wash)}
.contact-key{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.contact-val{font-size:1.3rem;overflow-wrap:anywhere}
.contact-val .arr{display:inline-block;transition:transform 140ms ease}
.contact-row:hover .contact-val .arr{transform:translateX(4px)}
@media (max-width:46rem){.contact-row{grid-template-columns:1fr}.contact-val{font-size:1.1rem}}

/* ---------- CV -------------------------------------------- */
.cv-entry{padding:1.5rem 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:.5rem 2.5rem}
.cv-when{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.25rem}
.cv-role{font-size:1.05rem;font-weight:600;margin:0 0 .15rem}
.cv-org{margin:0 0 .5rem;color:var(--muted);font-size:.95rem}
.cv-body ul{margin:0;padding-left:1.1rem}
.cv-body p:last-child,.cv-body ul:last-child{margin-bottom:0}
.rule-top{border-top:1px solid var(--ink);margin-top:3rem}

.courses{list-style:none;padding:0;margin:.6rem 0 0;max-width:46rem;column-count:2;column-gap:2.5rem}
.courses li{margin-bottom:.3rem;font-size:.94rem;break-inside:avoid}
.courses .code{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;color:var(--muted);margin-right:.6rem}

/* ---------- file / download bar --------------------------- */
.files{margin:3rem 0 0;padding:1.4rem 0 0;border-top:1px solid var(--ink)}
.filelist{list-style:none;padding:0;margin:.9rem 0 0;max-width:none;display:flex;flex-wrap:wrap;gap:.6rem 2rem;text-transform:none;letter-spacing:.02em;font-size:.78rem}
.filelist li{margin:0}
.filelist a{color:var(--accent)}
.filelist .size{color:var(--muted)}

/* ---------- buttons --------------------------------------- */
.btn-row{margin-top:1.4rem;display:flex;flex-wrap:wrap;gap:.8rem}
.btn{
  display:inline-block;font-family:var(--mono);font-size:.74rem;letter-spacing:.09em;
  text-transform:uppercase;text-decoration:none;color:var(--ink);
  border:1px solid var(--ink);padding:.6rem 1.7rem;cursor:pointer;background:none;
  transition:background 140ms ease,color 140ms ease;
}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper);text-decoration:none}

.back{display:inline-block;margin-bottom:1.8rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.back:hover{color:var(--ink);text-decoration-thickness:2px}

/* ---------- prev / next ------------------------------------ */
.pager{display:flex;justify-content:space-between;gap:2rem;margin-top:3rem;padding-top:1.3rem;border-top:1px solid var(--rule);font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.pager a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;max-width:18rem}
.pager a:hover{color:var(--ink);text-decoration-thickness:2px}
.pager a:last-child{text-align:right}

/* ---------- footer ---------------------------------------- */
.foot{margin-top:5rem;padding-top:1.2rem;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:.5rem 2rem;justify-content:space-between;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--ink)}

/* ---------- accessibility & motion ------------------------ */
a:focus-visible,.entry:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#main:focus{outline:none}  /* focus is moved here on route change, for screen readers, and needs no ring */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- edit mode -------------------------------------- */
.editbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--ink);color:var(--paper);
  display:none;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:.7rem var(--gutter);
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
}
body.editing .editbar{display:flex}
body.editing{padding-bottom:3.5rem}
.editbar .grow{flex:1}
.editbar button{font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:1px solid var(--paper);color:var(--paper);padding:.4rem 1.1rem;cursor:pointer}
.editbar button:hover{background:var(--paper);color:var(--ink)}
body.editing [data-edit]{outline:1px dashed #A8A79E;outline-offset:3px;min-width:1ch;min-height:1em;display:inline-block}
body.editing [data-edit]:focus{outline:1px solid var(--accent);background:#fff}
body.editing .entry{pointer-events:none}
body.editing .entry [data-edit]{pointer-events:auto}

/* ---------- look: ivory, sans headlines, rounded cards ------ */
h2,h3,.masthead nav,.entry-title,.entry-num,.stat-val,.cv-role,.contact-val{font-family:var(--sans)}
h2,h3,.entry-title,.cv-role{word-spacing:.06em}
h2{font-size:1.55rem;letter-spacing:-.01em;line-height:1.2}
h3{letter-spacing:0}
.entry-title{font-size:1.35rem;letter-spacing:-.005em}
.entry-num{letter-spacing:-.03em;font-feature-settings:"tnum" 1}
.cv-role{font-size:1.1rem;letter-spacing:0}
.masthead{border-bottom-color:var(--rule)}
.masthead nav a[aria-current="page"]{text-decoration-color:var(--blue)}
.masthead nav a:last-child{border-radius:8px}
.masthead nav a:last-child:hover{background:#3D3D3A}
a:hover{text-decoration-color:var(--blue)}

/* cards */
.register-group{border-bottom:0;padding-bottom:.9rem}
.register-group::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--blue);margin-right:.6rem;vertical-align:.05rem}
.entry{background:var(--wash);border:0;border-radius:var(--radius);padding:2rem 2.2rem;margin-bottom:1rem;transition:background 200ms ease,transform 200ms ease}
.entry:hover{background:var(--wash-2);transform:translateY(-2px)}
.entry-more{border-radius:8px;border-color:var(--ink);color:var(--ink)}
.entry:hover .entry-more,.entry:focus-visible .entry-more{background:var(--ink);color:var(--paper)}
.rule-top{border-top:0;margin-top:1.4rem}
.cv-entry{background:var(--wash);border:0;border-radius:var(--radius);padding:1.6rem 2rem;margin-bottom:.8rem}
.contact-list{border-top:0}
.contact-row{background:var(--wash);border:0;border-radius:var(--radius);padding:1.5rem 2rem;margin-bottom:.8rem}
.contact-row:hover{background:var(--wash-2)}
.eqblock,.terminal{border:0;border-radius:12px}
figure img{border-radius:12px}
.chart .line{stroke:var(--blue);stroke-width:2}
.chart .dot{stroke:var(--blue)}
.chart-legend i{border-top-color:var(--blue);border-top-width:2px}
.chart-tip{border-radius:8px}
.toggle,.btn{border-radius:8px}
.tbl tr.pick td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
.result{border-left-color:var(--blue)}
.files,.foot{border-top-color:var(--rule)}
.pager{border-top-color:var(--rule)}

/* ---------- responsive ------------------------------------ */
@media (max-width:46rem){
  .cv-head{grid-template-columns:1fr;gap:1.4rem}
  .cv-head .portrait{max-width:8.5rem;order:-1}
  .entry{grid-template-columns:1fr;gap:.9rem}
  .entry-num{font-size:1.5rem}
  .entry-course{float:none;display:block;margin:0 0 .4rem;text-align:left;max-width:none}
  .cv-entry{grid-template-columns:1fr;gap:.35rem}
  .entry,.cv-entry,.contact-row{padding:1.4rem 1.3rem}
  .courses{column-count:1}
  .masthead{padding-top:1.5rem;position:static}
  .masthead nav{gap:.85rem;font-size:.9rem}
  .masthead nav a:last-child{padding:.4rem .75rem}
  .pager{flex-direction:column;gap:.7rem}
  .pager a:last-child{text-align:left}
}

/* ---------- print ------------------------------------------ */
@media print{
  .masthead nav,.files,.editbar,.toggle,.pager,.btn-row{display:none}
  body{background:#fff;font-size:10.5pt}
  .shell{max-width:none;padding:0}
  a{color:var(--ink);text-decoration:none}
  .cv-entry,.entry{break-inside:avoid}
}
</style>

      "course": "TPG4145",
      "num": "01",
      "kicker": "Material balance",
      "unit": "bara",
      "figRows": [
        { "v": "483 → 156", "n": "Ekofisk, 56 years" },
        { "v": "448 → 258", "n": "Tommeliten, 11 years" },
        { "v": "448 → 93", "n": "Oseberg, 41 years" }
      ],
      "title": "Keeping the tank filled",
      "note": "Reconstructing the pressure history of three North Sea fields from nothing but their public production data.",
      "meta": "RESERVOIR ENGINEERING · PVT · EXCEL",
      "lede": "An Excel model that reconstructs reservoir pressure history for three Norwegian Continental Shelf fields from their public production and injection data.",
      "spec": [
        {"dt": "Fields", "dd": "Ekofisk, Tommeliten and Oseberg"},
        {"dt": "Fluids", "dd": "A volatile oil, a gas condensate and a conventional oil"},
        {"dt": "PVT", "dd": "Whitson black oil table"},
        {"dt": "Tools", "dd": "Excel with Solver"},
        {"dt": "Converged at", "dd": "SumSqErr &lt; 10⁻⁵ (achieved ≈ 10⁻¹¹)"}
      ],
      "blocks": [
        {"t": "h2", "v": "What the project is"},
        {"t": "p", "v": "The reservoir is treated as a single tank: a black oil PVT table describes the fluid, a volumetric balance describes the tank, and reservoir pressure is the unknown solved for at each year. Three real cases were run (Ekofisk, Tommeliten and Oseberg), covering a volatile oil, a gas condensate and a conventional oil."},
        {"t": "h2", "v": "How the model works"},
        {"t": "ol", "items": ["<b>PVT table.</b> A Whitson black oil table (Ekofisk analogue volatile oil, 10 000 psia, 250 °F, Rsi = 1500 scf/STB) is loaded and interpolated to give Rs, Bo, µo, Bgd, rs and µg as functions of pressure and in place GOR.", "<b>Initialisation.</b> From N, G, Sw, Bwi and the geological pore volume, the sheet computes in place volumes, the hydrocarbon and water pore volumes, and the aquifer to reservoir ratio M (0.85–0.86 for the three fields). A cross check recomputes N and G back from the reservoir phases and flags OK.", "<b>Yearly balance.</b> For each year, remaining surface volumes are updated from cumulative production and injection (Vô = N − Np, Vĝ = G − Gp + Ginj, Vŵ = W − Wp + Winj), and the phase volumes are rebuilt through the PVT table.", "<b>Pressure solve.</b> Excel Solver adjusts the whole p(t) column to minimise the summed squared relative residual between the phase volumes and the pressure dependent pore volume Vp(p) = Vpi · exp(−cp(pRi − p)). Search bounds are set per case (50–100 to 600–700 bara), converged at SumSqErr &lt; 10⁻⁵ (achieved ≈ 10⁻¹¹)."]},
        {"t": "h2", "v": "Key assumptions"},
        {"t": "ul", "items": ["Uniform pressure across the whole connected pore volume, reservoir and aquifer, with no spatial phase distribution.", "Water contains no dissolved gas or oil, and connate water is immobile.", "Constant pore and water compressibility (cp = 6.7·10⁻⁴ 1/bara for the chalk fields and 1.09·10⁻⁴ for Oseberg, cw = 4·10⁻⁵ 1/bara).", "Isothermal reservoir and constant surface densities throughout the production period."]},
        {"t": "h2", "v": "Field cases"},
        {"t": "table", "head": ["Field", "Fluid", "N, MSm³", "G, 10⁹ Sm³", "Years", "p: start → end"], "rows": [{"cells": ["Ekofisk", "Volatile oil", "795", "238.5", "56", "483 → 156 bara"]}, {"cells": ["Tommeliten", "Gas condensate", "7.8", "19.4", "11", "448 → 258 bara"]}, {"cells": ["Oseberg", "Oil", "812", "235.0", "41", "448 → 93 bara"]}]},
        {"t": "p", "v": "Ekofisk is water injected (≈ 670 MSm³ injected water, no gas injection). Oseberg runs with large scale gas reinjection (≈ 211·10⁹ Sm³) plus water injection. Tommeliten depletes without injection."},
        {"t": "p", "v": "The solved pressures are not compared against measured reservoir pressures. The model returns the pressure path that is consistent with the reported production and injection volumes under the assumptions above, so it shows what a zero-dimensional tank implies rather than what was recorded downhole. On a field like Ekofisk, where compaction drive and water weakening matter, the two will diverge."},
        {"t": "h2", "v": "Skills demonstrated"},
        {"t": "ul", "items": ["Black oil PVT handling: table interpolation, saturation pressure lookup, SI ↔ oilfield unit conversion.", "Material balance and volumetric reservoir engineering, including aquifer support and injection accounting.", "Numerical history matching with a bounded least squares solve and an explicit convergence criterion.", "Working with public NCS production data and building an auditable, documented spreadsheet model."]},
        {"t": "h2", "v": "Results: pressure history"},
        {"t": "figs", "items": [{"src": "mb-ekofisk", "alt": "Ekofisk reservoir pressure against time, 0 to 56 years, falling from 483 to 156 bara.", "cap": "<b>Figure 1. Ekofisk, 56 years.</b> Plateau to year 5, steep depletion to ≈ 195 bara by year 30, then a long shallow tail to 156 bara as water injection supports the pressure."}]},
        {"t": "figs", "items": [{"src": "mb-tommeliten", "alt": "Tommeliten reservoir pressure against time, 0 to 11 years, falling from 448 to 258 bara.", "cap": "<b>Figure 2. Tommeliten,</b> 11 years of pure depletion."}, {"src": "mb-oseberg", "alt": "Oseberg reservoir pressure against time, 0 to 41 years, falling from 448 to 93 bara.", "cap": "<b>Figure 3. Oseberg,</b> 41 years, with gas reinjection slowing the decline mid life."}]},
        {"t": "note", "v": "Coursework for TPG4145 Reservoir Fluids and Flow, NTNU, spring 2026."}
      ],
      "files": []
    },

    {
      "slug": "ultima-thule",
      "group": "Coursework",
      "course": "TPG4230",
      "num": "02",
      "kicker": "Field development",
      "figure": "50–55",
      "unit": "% recovery",
      "figNote": "Water + gas injection, against 36–41 % for depletion",
      "title": "Ultima Thule Concept Selection",
      "note": "Concept selection for an offshore oil field, from drainage strategy through facility choice, schedule and risk.",
      "meta": "EQUINOR UNIVERSITY COURSE · DRAINAGE STRATEGY",
      "lede": "Concept selection for a discovered offshore oil field with associated gas, taken from DG0 to a recommended development concept.",
      "spec": [
        {"dt": "Field", "dd": "Ultima Thule, offshore Exlandia"},
        {"dt": "STOOIP", "dd": "105.3 MSm³ (663 MMbbl)"},
        {"dt": "Water depth", "dd": "Roughly 300 m"},
        {"dt": "Team", "dd": "Group of four"}
      ],
      "blocks": [
        {"t": "h2", "v": "Summary"},
        {"t": "p", "v": "The work covered drainage strategy, surface facility and well type, a DG0–DG4 schedule, and a risk and HSE assessment. The recommendation was a standalone FPSO with wet wellheads, produced with combined water and gas injection."},
        {"t": "p", "v": "The case is the one Equinor uses in its internal field development programme, the fictitious Ultima Thule field, set in the fictitious country Exlandia. Some of the tasks from the original Equinor course were cut out for the NTNU version."},
        {"t": "h2", "v": "The field"},
        {"t": "p", "v": "Ultima Thule is an oil reservoir with associated gas, in roughly 300 m water depth offshore Exlandia. STOOIP is 105.3 MSm³ (663 MMbbl). The field lies far enough from shore that the export solution is part of the concept decision rather than an afterthought. An existing platform, Jubilado, sits about 50 km away with spare processing capacity."},
        {"t": "p", "v": "The task at DG1 was to screen the realistic development concepts and select one that maximises value, not to optimise a design."},
        {"t": "h2", "v": "Drainage strategy"},
        {"t": "p", "v": "Four drive mechanisms were run in the reservoir model and compared on recovery factor, for both dry and wet wellheads:"},
        {"t": "table", "head": ["Strategy", "RF, dry wellheads", "RF, wet wellheads"], "rows": [{"cells": ["Depletion", "41 %", "36 %"]}, {"cells": ["Gas reinjection", "47 %", "42 %"]}, {"cells": ["Water injection", "53 %", "48 %"]}, {"pick": true, "cells": ["Water + gas injection", "55 %", "50 %"]}]},
        {"t": "p", "v": "Depletion and gas reinjection were dropped early. On a reservoir this size the barrels left behind are worth more than the CAPEX saved, and neither strategy reaches a sufficient recovery factor."},
        {"t": "p", "v": "Water injection alone gives an acceptable recovery with dry wellheads but falls short with wet ones. Combined water and gas injection gives the highest recovery in both cases, keeps the associated gas out of the flare, and uses miscible gas to reduce oil viscosity and mobilise oil that waterflood alone leaves behind. It was proposed as the drainage strategy, accepting the added cost and complexity of gas recompression and reinjection on top of produced water treatment."},
        {"t": "h2", "v": "Surface facility and well type"},
        {"t": "p", "v": "Three concepts were evaluated, all consistent with the chosen drainage strategy:"},
        {"t": "table", "head": ["", "Tie-back to Jubilado", "Standalone FPSO", "Standalone platform"], "rows": [{"cells": ["Plateau rate", "40 kbbl/d", "80 kbbl/d", "80 kbbl/d"]}, {"cells": ["Well type", "Wet wellheads", "Wet wellheads", "Dry wellheads"]}, {"cells": ["Recovery factor", "50 %", "50 %", "55 %"]}, {"cells": ["Export route", "50 km pipeline to Jubilado", "Shuttle tanker to Exlandia terminal", "Shuttle tanker to Exlandia terminal"]}, {"cells": ["Tariff exposure", "$1.5/bbl", "None", "None"]}, {"cells": ["CAPEX", "Low", "Moderate", "High"]}, {"cells": ["Verdict", "Rejected", "<b>Selected</b>", "Rejected"]}]},
        {"t": "p", "v": "<b>Tie-back to Jubilado</b> is the cheapest option but caps plateau at Jubilado's spare processing capacity, 40 kbbl/d, and carries a $1.5/bbl tariff. Halving the plateau on a 663 MMbbl field pushes production far to the right, and discounted cash flow punishes that harder than the CAPEX saving rewards it."},
        {"t": "p", "v": "<b>Standalone platform</b> buys back the 5 % recovery that dry wellheads give, through better well access and cheaper interventions over field life. But a bottom-founded structure in 300 m of water is at the expensive end of the range, and the marginal recovery gain does not cover the step change in CAPEX."},
        {"t": "p", "v": "<b>Standalone FPSO</b> is the balance: full 80 kbbl/d plateau, no tariff exposure, storage and offloading built into the hull, no fixed structure in 300 m of water, and the ability to move off station ahead of a hurricane. The cost is wet wellheads (subsea interventions are complex and expensive), which is carried as a live risk rather than designed away."},
        {"t": "h2", "v": "Schedule"},
        {"t": "p", "v": "A schedule was proposed from DG0 through to start of production:"},
        {"t": "table", "head": ["Phase", "Duration", "Deliverable"], "rows": [{"cells": ["DG0 → DG1, concept screening and selection", "6–12 months", "Selected concept, rough development strategy"]}, {"cells": ["DG1 → DG2, concept development (pre-FEED)", "12–18 months", "Preferred concept, cost estimate ±30 %"]}, {"cells": ["DG2 → DG3, FEED and investment decision", "18–24 months", "Final investment decision, cost estimate ±10–15 %"]}, {"cells": ["DG3 → DG4, execution", "3–5 years", "Field installed, ready for start-up"]}, {"cells": ["DG4, start of production", "6–8 years after DG0", "Start-up, ramp-up, stable operation"]}]},
        {"t": "h2", "v": "Risk picture"},
        {"t": "p", "v": "Risks were mapped across four categories and scored on probability and consequence."},
        {"t": "p", "v": "<b>Technology.</b> Complex topside processing on the FPSO (separation, gas handling, produced water treatment in one hull). Flow assurance at low seabed temperature, with hydrate formation, waxing and scaling in flowlines and risers. Wellhead intervention, made costly by the wet wellhead choice. Weather-dependent shuttle tanker offloading. FPSO exposure in harsh weather."},
        {"t": "p", "v": "<b>Reservoir.</b> Poor reservoir connectivity. Gas cap management (producing the cap too early costs pressure and recovery, mishandling it risks gas coning). Aquifer strength uncertainty, where a weak aquifer means pressure decline and a strong one means early water breakthrough."},
        {"t": "p", "v": "<b>Schedule.</b> Subsea installation delayed by weather, and problems during drilling. Both delay first oil, shift cash flow and reduce NPV."},
        {"t": "p", "v": "<b>Commercial.</b> Oil price drop, sulphur content penalties, distance to market, falling oil demand, and country risk in Exlandia's tax and royalty regime."},
        {"t": "h2", "v": "Environmental impact and HSE"},
        {"t": "p", "v": "The environmental footprint of the selected concept was assessed across the field life:"},
        {"t": "ul", "items": ["CO₂ and NOₓ emissions from powering the FPSO with reservoir gas, and from shuttle tanker fuel", "Discharge of produced water to sea, affecting marine organisms and ecosystems", "Oil spill scenarios from pipeline failure, subsea leaks or topside blowout", "Seabed disturbance from installation of flowlines, risers, manifolds and wells", "Underwater noise from shuttle tankers and operating subsea structures, affecting marine mammals and fish"]},
        {"t": "h2", "v": "Recommendation"},
        {"t": "result", "v": "Develop Ultima Thule with a standalone FPSO, wet wellheads, and combined water and gas injection, exporting crude by shuttle tanker to the Exlandia terminal. This delivers the full 80 kbbl/d plateau with no tariff exposure, a 50 % recovery factor, and avoids both the export bottleneck of the tie-back and the CAPEX of a fixed structure in 300 m of water."},
        {"t": "note", "v": "Group project, four students. TPG4230 Field Development and Operations, NTNU, spring 2026."}
      ],
      "files": []
    },

    {
      "slug": "core-analysis",
      "group": "Coursework",
      "course": "TPG4116",
      "num": "03",
      "kicker": "Special core analysis",
      "figure": "223",
      "unit": "mD",
      "figNote": "Absolute permeability (liquid), 513 mD with air",
      "title": "Special Core Analysis",
      "note": "Nine laboratory experiments on one sandstone core, measuring the properties that decide how much CO₂ a Snøhvit analogue could store.",
      "meta": "KLINKENBERG · RELATIVE PERMEABILITY",
      "lede": "The project used Exxsol D60 as a laboratory analogue for CO₂, to assess whether a sandstone core analogue to the Snøhvit field could be used for CO₂ storage and to estimate how much CO₂ the formation could hold.",
      "spec": [
        {"dt": "Core", "dd": "Snøhvit reservoir analogue"},
        {"dt": "Model fluid", "dd": "Exxsol D60, for CO₂"},
        {"dt": "Experiments", "dd": "Nine, on the same core sample"},
        {"dt": "Team", "dd": "Group of three"}
      ],
      "blocks": [
        {"t": "h2", "v": "Objective"},
        {"t": "p", "v": "Because Exxsol D60 stands in for CO₂, a second aim was to judge how well that analogue actually holds up. The results were also compared against the long-term CO₂ storage the field already performs."},
        {"t": "h2", "v": "Laboratory work"},
        {"t": "p", "v": "I carried out the full experimental programme in the lab together with two fellow students. Over the semester we ran nine separate experiments on the same core sample and the associated fluids, handling the equipment, the fluid preparation and cleaning routines, and the data logging ourselves:"},
        {"t": "ul", "items": ["Porosity by helium porosimeter and by brine saturation in a vacuum desiccator, with pycnometer density measurements", "Absolute permeability with an air permeameter (Klinkenberg correction) and with a liquid permeameter", "Dynamic viscosity of brine and Exxsol D60 using a capillary viscometer and a Fann rotational viscometer", "Interfacial tension with a du Noüy ring tensiometer for brine, Milli-Q water and a surfactant solution", "Wettability by contact angle on glass and sandstone, using a goniometer and the captive bubble method", "Drainage and imbibition core floods to obtain saturations and relative permeability endpoints"]},
        {"t": "p", "v": "Measurements were processed in Python, where regression was used to extract permeability and viscosity from the plotted data. A maximum error analysis was carried out for each experiment, and the measured fluid properties were checked against literature values."},
        {"t": "h2", "v": "Key results"},
        {"t": "table", "head": ["Property", "Value", "Property", "Value"], "rows": [{"cells": ["Effective porosity (He)", "17.8 %", "Viscosity, Exxsol D60", "1.372 cP"]}, {"cells": ["Effective porosity (brine)", "17.2 %", "Viscosity, 3 % NaCl brine", "0.977 cP"]}, {"cells": ["Absolute permeability (liquid)", "223 mD", "Contact angle, sandstone–brine", "87.3°"]}, {"cells": ["Absolute permeability (air)", "513 mD", "Irreducible water saturation, Swi", "0.323"]}, {"cells": ["Relative permeability, kro (Swi)", "0.723", "Residual oil saturation, Sor", "0.229"]}]},
        {"t": "p", "v": "Porosity and permeability were in the same order of magnitude as the reported field averages, and the core proved water-wet, which is favourable for storage since the injected non-wetting phase is then trapped as a residual saturation when water moves back in. Exxsol D60 proved an acceptable analogue for CO₂, and a useful fluid for studying two-phase displacement in the pore space."},
        {"t": "note", "v": "Laboratory project, TPG4116 Description and Characterization of Porous Media and Flow by Laboratory Analysis, NTNU, autumn 2025."}
      ],
      "files": []
    },

      "kicker": "Well planning",
      "figure": "1.50 – 1.67",
      "unit": "sg",
      "figNote": "Mud-weight window, 3 500 m shale at 140 °C",
      "title": "Mud Program & Drilling Fluid Advisor",
      "note": "A command-line tool that sizes the mud-weight window, recommends a fluid type, and passes the case to an LLM for a second opinion.",
      "meta": "PYTHON · LLM-ASSISTED",
      "lede": "An interactive command-line tool that calculates the safe mud weight window for a well, recommends a drilling fluid type, and uses the Anthropic Claude API to deliver petroleum-engineering reasoning in the terminal of your chosen editor.",
      "spec": [
        {"dt": "Repository", "dd": "<a href=\"https://github.com/isakmoe-hansen/drilling-advisor\">github.com/isakmoe-hansen/drilling-advisor</a>"},
        {"dt": "Units", "dd": "Metres, °C, specific gravity, bar"},
        {"dt": "Tools", "dd": "Python 3.10+, Anthropic Claude API"}
      ],
      "blocks": [
        {"t": "p", "v": "Built as a personal project to combine petroleum engineering fundamentals with modern LLM tooling."},
        {"t": "h2", "v": "Demo"},
        {"t": "pre", "v": "=======================================================\n   MUD PROGRAM / DRILLING FLUID ADVISOR\n=======================================================\n\nEnter your well parameters below.\n\n── Well conditions ───────────────────────────────\n  True vertical depth (m): 3500\n  Bottom-hole temperature (°C): 140\n  Casing shoe TVD (m) [3500.0]:\n\n── Pressure gradients ────────────────────────────\n  Pore pressure gradient (sg): 1.45\n  Fracture gradient (sg): 1.72\n  Fracture gradient at casing shoe (sg) [1.72]:\n\n  Primary lithology:\n    1. Shale\n    2. Sandstone\n    3. Carbonate / Limestone\n    4. Salt / Evaporite\n    5. Mixed / Interbedded\n  Enter number: 1\n\n  Formation sensitivity to water:\n    1. Low\n    2. Moderate\n    3. High\n  Enter number: 2\n\n── Safety margins ────────────────────────────────\n  Kick / trip margin (sg) [0.05]:\n  Loss margin below frac. gradient (sg) [0.05]:\n\nCalculating mud weight window …\nSending to Claude for expert analysis …\n\n=======================================================\n   RESULTS\n=======================================================\n\n── Mud Weight Window ──────────────────────────────\n  Pore pressure gradient : 1.45 sg  (497.9 bar)\n  Fracture gradient      : 1.72 sg  (590.6 bar)\n  ─────────────────────────────────────────────────\n  Min safe MW            : 1.5 sg   (PP + 0.05 sg kick margin)\n  Max safe MW            : 1.67 sg  (FG – 0.05 sg loss margin)\n  Recommended MW         : 1.585 sg (1585.0 kg/m³)\n  Window width           : 0.17 sg\n  MAASP (at rec. MW)     : 46.4 bar  (shoe at 3500.0 m)\n\n── Preliminary Mud Type ───────────────────────────\n  Inhibitive Water-Based Mud (KCl / PHPA / glycol)\n\n── Expert Advisory (Claude) ───────────────────────\n  [Claude's step-by-step drilling engineering analysis appears here]\n======================================================="},
        {"t": "h2", "v": "Engineering formulas"},
        {"t": "eq", "items": [{"dt": "Hydrostatic pressure", "dd": "P (bar) = SG × 0.0981 × TVD (m)"}, {"dt": "MW<sub>min</sub>", "dd": "= Pore Pressure Gradient + Kick Margin"}, {"dt": "MW<sub>max</sub>", "dd": "= Fracture Gradient − Loss Margin"}, {"dt": "MW<sub>recommended</sub>", "dd": "= (MW<sub>min</sub> + MW<sub>max</sub>) / 2"}, {"dt": "MAASP (bar)", "dd": "= (Fracture Gradient at shoe − MW<sub>recommended</sub>) × 0.0981 × Shoe TVD"}]},
        {"t": "p", "v": "The window represents the range of mud weights that keep the well in balance, heavy enough to prevent a kick, light enough to avoid lost circulation."},
        {"t": "p", "v": "MAASP is the maximum surface casing pressure that can be applied before fracturing the formation, a key well-control limit. The weakest point in the open hole is taken as the casing shoe. Shoe depth and shoe fracture gradient default to TVD and the fracture gradient if left blank."},
        {"t": "h2", "v": "Mud type selection"},
        {"t": "p", "v": "A rule-based engine maps the combination of lithology, formation water sensitivity, and BHT to a preliminary fluid recommendation (WBM, inhibitive WBM, OBM, or SBM). Claude then validates and refines this recommendation with contextual reasoning."},
        {"t": "h2", "v": "About"},
        {"t": "p", "v": "This project was built to explore how large language models can augment traditional engineering workflows."},
        {"t": "note", "v": "Personal project, 2026."}
      ],
      "files": [
        {"label": "Source on GitHub", "href": "https://github.com/isakmoe-hansen/drilling-advisor", "size": "Python"}
      ]
    },

  "about": {
    "title": "About",
    "h1": "About me",
    "lede": "I am Isak Moe-Hansen. Fourth-year student on the five-year MSc in Georesources and Geotechnology at NTNU, specialising in drilling and production technology. Looking for a summer internship in the petroleum industry.",
    "sections": [
      {

   Below this line is machinery: routing, rendering, the grade chart and
   the edit mode. You should not need to touch any of it to change words.
   ========================================================================= */

const C  = CONTENT;
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---- read / write a value by dotted path, for the edit mode ---------- */
function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setPath(obj, path, val) {
  const keys = path.split(".");
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = val;
}

/* Editable field: renders the value and tags it with its path. */
function ed(path, tag, cls) {
  const v = getPath(C, path);
  const t = tag || "span";
  const c = cls ? ' class="' + cls + '"' : "";
  return "<" + t + c + ' data-edit="' + path + '">' + (v == null ? "" : v) + "</" + t + ">";
}

function renderNav(page) {
  $("#wordmark").innerHTML = '<span data-edit="site.wordmark">' + C.site.wordmark + "</span>";

/* ---------------------------------------------------------------------
   Blocks inside a project page
   --------------------------------------------------------------------- */
function renderBlock(b, base) {
  switch (b.t) {
    case "h2":
      return ed(base + ".v", "h2");
    case "p":
      return ed(base + ".v", "p");
    case "pre":
      return ed(base + ".v", "pre", "terminal");
    case "label":
      return ed(base + ".v", "span", "label");
    case "result":
      return '<div class="result">' + ed(base + ".v", "p") + "</div>";
    case "note":
      return '<p class="entry-meta" style="max-width:34rem;text-transform:none;letter-spacing:.02em">' +
             '<span data-edit="' + base + '.v">' + b.v + "</span></p>";
    case "ul":
    case "ol":
      return "<" + b.t + ">" + b.items.map(function (_, i) {
        return ed(base + ".items." + i, "li");
      }).join("") + "</" + b.t + ">";
    case "figs":
      return '<div class="figs figs-' + b.items.length + '">' + b.items.map(function (f, i) {
        return '<figure><img src="' + (FIGS[f.src] || "") + '" alt="' + f.alt + '" loading="lazy">' +
          ed(base + ".items." + i + ".cap", "figcaption") + "</figure>";
      }).join("") + "</div>";
    case "stats":
      return '<div class="stats">' + b.items.map(function (it, i) {
        return "<div>" +
          ed(base + ".items." + i + ".v", "span", "stat-val") +
          ed(base + ".items." + i + ".n", "span", "stat-note") +
        "</div>";
      }).join("") + "</div>";
    case "eq":
      return '<div class="eqblock"><dl>' + b.items.map(function (it, i) {
        return ed(base + ".items." + i + ".dt", "dt") + ed(base + ".items." + i + ".dd", "dd");
      }).join("") + "</dl></div>";
    case "table":
      return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        b.head.map(function (h, i) { return ed(base + ".head." + i, "th"); }).join("") +
        "</tr></thead><tbody>" +
        b.rows.map(function (r, ri) {
          return '<tr class="' + (r.pick ? "pick" : "") + '">' +
            r.cells.map(function (c, ci) {
              return ed(base + ".rows." + ri + ".cells." + ci, "td");
            }).join("") + "</tr>";
        }).join("") +
        "</tbody></table></div>";
    default:
      return "";
  }
}

/* ---------------------------------------------------------------------
   Grade chart — draws itself from cv.chart.semesters.
   Add a semester to the content block and the line, the dots, the
   cumulative average and the data table all follow.
   --------------------------------------------------------------------- */
const LETTER = { 5: "A", 4: "B", 3: "C", 2: "D", 1: "E" };

function chartData() {
  const sem = C.cv.chart.semesters;
  let runTotal = 0, runCount = 0;
  return sem.map(function (s) {
    const avg = s.grades.reduce(function (a, b) { return a + b; }, 0) / s.grades.length;
    runTotal += s.grades.reduce(function (a, b) { return a + b; }, 0);
    runCount += s.grades.length;
    return {
      label: s.term.slice(0, 3).toUpperCase() + " " + String(s.year).slice(2),
      term: s.term, year: s.year, n: s.grades.length,
      avg: avg, cum: runTotal / runCount
    };
  });
}

function renderChart() {
  const host = $("#chart");
  if (!host) return;
  const d = chartData();
  if (!d.length) return;

  const W = 700, H = 250, L = 30, R = 8, T = 12, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const x = function (i) { return L + (d.length === 1 ? iw / 2 : (iw * i) / (d.length - 1)); };
  const y = function (v) { return T + ih - ((v - 1) / 4) * ih; };

  const shadeFrom = C.cv.chart.shadeFrom;
  const bandX = shadeFrom > 0 ? (x(shadeFrom - 1) + x(shadeFrom)) / 2 : L;

  const alt = (C.cv.chart.caption || C.cv.chartTitle + ": average grade per semester against the cumulative average, " + d[0].label + " to " + d[d.length - 1].label + ".");
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    alt.replace(/"/g, "&quot;") + '">';

  if (shadeFrom < d.length) {
    svg += '<rect class="band" x="' + bandX + '" y="' + T + '" width="' + (W - R - bandX) +
           '" height="' + ih + '"></rect>';
  }
  for (let g = 1; g <= 5; g++) {
    svg += '<line class="grid" x1="' + L + '" y1="' + y(g) + '" x2="' + (W - R) + '" y2="' + y(g) + '"></line>';
    svg += '<text class="tick" x="' + (L - 8) + '" y="' + (y(g) + 3) + '" text-anchor="end">' + LETTER[g] + "</text>";
  }
  svg += '<line class="axis" x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '"></line>';

  const path = function (key) {
    return d.map(function (p, i) { return (i ? "L" : "M") + x(i) + " " + y(p[key]); }).join(" ");
  };
  svg += '<clipPath id="chart-clip"><rect x="0" y="0" width="' + W + '" height="' + H + '"></rect></clipPath>';
  svg += '<line class="guide" x1="0" y1="' + T + '" x2="0" y2="' + (T + ih) + '"></line>';
  svg += '<g clip-path="url(#chart-clip)">';
  svg += '<path class="avgline" d="' + path("cum") + '"></path>';
  svg += '<path class="line" d="' + path("avg") + '"></path>';
  svg += "</g>";
  d.forEach(function (p, i) {
    svg += '<circle class="dot" cx="' + x(i) + '" cy="' + y(p.avg) + '" r="3.4"></circle>';
    svg += '<text class="tick" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + p.label + "</text>";
  });
  svg += "</svg>";

  const last = d[d.length - 1];
  host.innerHTML = svg +
    '<div class="chart-legend">' +
      "<span><i></i>Semester average</span>" +
      '<span><i class="dash"></i>Cumulative average, now ' + last.cum.toFixed(2) + "</span>" +
      (shadeFrom < d.length
        ? '<span><i class="band"></i><span data-edit="cv.chart.shadeLabel">' +
          C.cv.chart.shadeLabel + "</span></span>"
        : "") +
    "</div>" +
    (C.cv.chart.caption
      ? '<figcaption style="margin-top:.9rem"><span data-edit="cv.chart.caption">' +
        C.cv.chart.caption + "</span></figcaption>"
      : "") +
    '<button class="toggle" id="tbl-toggle" aria-expanded="false" aria-controls="tbl-data">' +
      C.cv.tableShow + "</button>" +
    '<div id="tbl-data" hidden><div class="tbl-wrap"><table class="tbl">' +
      "<thead><tr><th>Semester</th><th>Courses</th><th>Semester average</th><th>Cumulative average</th></tr></thead><tbody>" +
      d.map(function (p) {
        return "<tr><td>" + p.term + " " + p.year + "</td><td>" + p.n + "</td><td>" +
          p.avg.toFixed(2) + "</td><td>" + p.cum.toFixed(2) + "</td></tr>";
      }).join("") +
    "</tbody></table></div></div>";

  host.insertAdjacentHTML("afterbegin", '<div class="chart-tip" aria-hidden="true"></div>');
  chartHover(host, d, x, y, W);
  chartReveal(host, d, x, W);

  const btn = $("#tbl-toggle"), box = $("#tbl-data");
  btn.addEventListener("click", function () {
    const open = box.hasAttribute("hidden");
    if (open) { box.removeAttribute("hidden"); } else { box.setAttribute("hidden", ""); }
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? C.cv.tableHide : C.cv.tableShow;
  });
}

/* ---------------------------------------------------------------------
   Motion — the chart draws itself and the headline numbers count up
   when they scroll into view. Skipped for reduced motion and edit mode.
   --------------------------------------------------------------------- */
const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let seen = null;

function onVisible(el, fn) {
  if (CALM || !("IntersectionObserver" in window)) { fn(); return; }
  if (!seen) {
    seen = new IntersectionObserver(function (list) {
      list.forEach(function (e) {
        if (!e.isIntersecting) return;
        seen.unobserve(e.target);
        const f = e.target._onVisible; e.target._onVisible = null;
        if (f) f();
      });
    }, { threshold: 0.35 });
  }
  el._onVisible = fn;
  seen.observe(el);
}

function tween(ms, step, done) {
  const t0 = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / ms);
    step(1 - Math.pow(1 - t, 3));                  // ease-out cubic
    if (t < 1) requestAnimationFrame(frame); else if (done) done();
  })(t0);
}

function chartReveal(host, d, x, W) {
  if (CALM || document.body.classList.contains("editing")) return;
  const rect = host.querySelector("#chart-clip rect");
  const dots = host.querySelectorAll(".dot");
  host.classList.add("pre");
  rect.setAttribute("width", "0");
  dots.forEach(function (c) { c.classList.add("hide"); });
  onVisible(host, function () {
    host.classList.remove("pre");
    tween(1600, function (k) {
      const edge = W * k;
      rect.setAttribute("width", String(edge));
      dots.forEach(function (c, i) { if (x(i) <= edge + 2) c.classList.remove("hide"); });
    }, function () { dots.forEach(function (c) { c.classList.remove("hide"); }); });
  });
}

function chartHover(host, d, x, y, W) {
  const svg = host.querySelector("svg"), tip = host.querySelector(".chart-tip");
  const guide = svg.querySelector(".guide"), dots = svg.querySelectorAll(".dot");
  let at = -1;
  function show(i) {
    if (i === at) return;
    at = i;
    const p = d[i], gx = String(x(i));
    guide.setAttribute("x1", gx); guide.setAttribute("x2", gx);
    dots.forEach(function (c, j) { c.classList.toggle("on", j === i); });
    tip.innerHTML = "<b>" + p.term + " " + p.year + "</b><br>" +
      "Semester " + p.avg.toFixed(2) + " (" + LETTER[Math.round(p.avg)] + ")<br>" +
      "Cumulative " + p.cum.toFixed(2) + "<br>" + p.n + (p.n === 1 ? " course" : " courses");
    const box = svg.getBoundingClientRect(), s = box.width / W;
    const px = x(i) * s, py = y(p.avg) * (box.height / svg.viewBox.baseVal.height);
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 12;
    if (left + tw > box.width) left = px - tw - 12;
    tip.style.transform = "translate(" + Math.max(0, left) + "px," + Math.max(0, py - th / 2) + "px)";
  }
  svg.addEventListener("pointermove", function (e) {
    const box = svg.getBoundingClientRect();
    const vx = (e.clientX - box.left) * (W / box.width);
    let best = 0;
    d.forEach(function (_, i) { if (Math.abs(x(i) - vx) < Math.abs(x(best) - vx)) best = i; });
    host.classList.add("hovering");
    show(best);
  });
  function hide() {
    host.classList.remove("hovering");
    dots.forEach(function (c) { c.classList.remove("on"); });
    at = -1;
  }
  // a tap on a phone keeps the label up until the next tap elsewhere
  svg.addEventListener("pointerleave", function (e) { if (e.pointerType !== "touch") hide(); });
  document.addEventListener("pointerdown", function (e) { if (!svg.contains(e.target)) hide(); });
}

/* Count every number inside el up from zero, then restore the exact
   original markup so edit mode never saves an in-between value. */
function countUp(el) {
  const html = el.innerHTML, nodes = [];
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) {
    const n = walk.currentNode, parts = [];
    n.nodeValue.replace(/\d+(?:\.\d+)?/g, function (m) { parts.push(m); return m; });
    if (parts.length) nodes.push({ n: n, src: n.nodeValue });
  }
  if (!nodes.length) return;
  el._countDone = function () { el.innerHTML = html; el._countDone = null; };
  const draw = function (k) {
    nodes.forEach(function (o) {
      o.n.nodeValue = o.src.replace(/\d+(?:\.\d+)?/g, function (m) {
        const dec = (m.split(".")[1] || "").length;
        return (parseFloat(m) * k).toFixed(dec);
      });
    });
  };
  draw(0);
  onVisible(el, function () {
    tween(1300, function (k) { if (el._countDone) draw(k); }, function () { if (el._countDone) el._countDone(); });
  });
}

function animateNumbers() {
  if (CALM || document.body.classList.contains("editing")) return;
  $$(".entry-num > [data-edit], .stat-val").forEach(countUp);
}

function finishMotion() {
  $$("[data-edit]").forEach(function (el) { if (el._countDone) el._countDone(); });
  $$(".chart.pre").forEach(function (c) {
    c.classList.remove("pre");
    const r = c.querySelector("#chart-clip rect"); if (r) r.setAttribute("width", "100%");
    c.querySelectorAll(".dot").forEach(function (dot) { dot.classList.remove("hide"); });
  });
}

/* ---------------------------------------------------------------------
   Router
   --------------------------------------------------------------------- */
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const main = $("#main");
  let page = "work", html, title = C.index.title;

  if (hash.indexOf("p/") === 0) {
    const slug = hash.slice(2);
    const p = C.projects.find(function (q) { return q.slug === slug; });
    if (p) { page = "project"; html = pageProject(slug); title = p.title + " — " + C.site.name; }
    else   { html = pageWork(); }
  } else if (hash === "experience") {
    page = "experience"; html = pageExperience(); title = C.experience.title + " — " + C.site.name;
  } else if (hash === "projects") {
    html = pageWork(); title = "Projects — " + C.site.name;
  } else if (hash === "contact") {
    page = "contact"; html = pageContact(); title = C.contact.title + " — " + C.site.name;
  } else if (hash === "cv") {
    page = "cv"; html = pageCV(); title = C.cv.title + " — " + C.site.name;
  } else {
    // the front page (and #/about, and any unknown address) is About
    page = "about"; html = pageAbout();
    if (hash === "about") title = C.about.title + " — " + C.site.name;
  }

  main.innerHTML = html;
  const plain = document.createElement("span");  // titles may hold markup or entities such as &amp;
  plain.innerHTML = title;
  document.title = plain.textContent;
  renderNav(page);
  renderFoot();
  if (page === "cv") renderChart();
  animateNumbers();
  if (document.body.classList.contains("editing")) armEditing();
  main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------------
   Edit mode — click any text, type, press Download.
   Rewrites the CONTENT block in a fresh copy of this file.
   --------------------------------------------------------------------- */
function armEditing() {
  $$("[data-edit]").forEach(function (el) {
    el.setAttribute("contenteditable", "true");
    el.setAttribute("spellcheck", "true");
  });
}
function disarmEditing() {
  $$("[data-edit]").forEach(function (el) {
    el.removeAttribute("contenteditable");
    el.removeAttribute("spellcheck");
  });
}

function collectEdits() {
  const copy = JSON.parse(JSON.stringify(C));
  $$("[data-edit]").forEach(function (el) {
    const html = el.innerHTML.replace(/<br\s*\/?>\s*$/i, "").trim();
    setPath(copy, el.getAttribute("data-edit"), html);
  });
  return copy;
}

function download() {
  const updated = collectEdits();

  /* Rebuild the file: empty the rendered regions, drop edit state, then
     swap the CONTENT block for the edited one. */
  const wasEditing = document.body.classList.contains("editing");
  disarmEditing();
  document.body.classList.remove("editing");
  const main = $("#main"), nav = $("#nav"), foot = $("#foot"), wm = $("#wordmark");
  const keep = [main.innerHTML, nav.innerHTML, foot.innerHTML, wm.innerHTML];
  main.innerHTML = ""; nav.innerHTML = ""; foot.innerHTML = ""; wm.innerHTML = "";

  let src = "<!doctype html>\n" + document.documentElement.outerHTML;

  main.innerHTML = keep[0]; nav.innerHTML = keep[1];
  foot.innerHTML = keep[2]; wm.innerHTML = keep[3];
  if (wasEditing) { document.body.classList.add("editing"); armEditing(); }

  const block = "/* CONTENT:START */\nconst CONTENT = " +
                JSON.stringify(updated, null, 2) + ";\n/* CONTENT:END */";
  const re = /\/\* CONTENT:START \*\/[\s\S]*?\/\* CONTENT:END \*\//;
  if (!re.test(src)) { alert("Could not find the content block — nothing was saved."); return; }
  src = src.replace(re, function () { return block; });

  const blob = new Blob([src], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  $("#edit-status").textContent = "Saved to your Downloads — move it into the site folder.";
}

function toggleEdit(on) {
  const want = on === undefined ? !document.body.classList.contains("editing") : on;
  document.body.classList.toggle("editing", want);
  if (want) { finishMotion(); armEditing(); $("#edit-status").textContent = "Click any text and type."; }
  else { disarmEditing(); }
}

document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "E" || e.key === "e")) {
    e.preventDefault(); toggleEdit();
  }
});

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("hashchange", route);
route();
$("#edit-download").addEventListener("click", download);
$("#edit-exit").addEventListener("click", function () { toggleEdit(false); });
if (/(^|[?&])edit($|[=&])/.test(location.search)) toggleEdit(true);
</script>
